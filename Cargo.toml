[package]
name = "axl"
version = "0.1.0"
edition = "2024"
authors = ["Cesar Ferreira <cesar.manuel.ferreira@gmail.com>"]
license = "MIT"
description = "Stack-aware developer workflow CLI"
repository = "https://github.com/cesarferreira/axl"
readme = "README.md"

[dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.20", features = ["derive"] }
directories = "5.0.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
toml = "0.8.20"
which = "6.0.3"
